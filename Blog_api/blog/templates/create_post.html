{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}
{% block content %}

<div class="container">
    <h1>Create Post</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="title"
            placeholder="Post title"
            required
        >
        <br><br>

        <textarea
            name="content"
            placeholder="Write your post..."
            rows="10"
            required
        ></textarea>

        <br><br>
        <button type="submit">
            Publish
        </button>

    </form>
</div>
{% endblock %}
