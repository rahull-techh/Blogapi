{% extends "base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="container">

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>{{ post.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'post_list' %}">
        Cancel
    </a>

</div>

{% endblock %}
