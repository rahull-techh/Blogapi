{% extends "base.html" %}

{% block title %}
Blog Posts
{% endblock %}

{% block content %}
<div class="container">

    <h1>Blog Posts</h1>
    {% for post in posts %}

        <article>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <p>
                <strong>
                    Author:
                </strong>
                {{ post.author.username }}
            </p>
            <p>
                Created:
                {{ post.created_at }}
            </p>
            <a href="{% url 'update_post' post.id %}">
                <button type="button">Edit</button>
            </a>

            <a href="{% url 'delete_post' post.id %}">
                <button type="button">Delete</button>
            </a>
            
        </article>

        <hr>
    {% empty %}
        <p>No posts available.</p>
    {% endfor %}
</div>

{% endblock %}
