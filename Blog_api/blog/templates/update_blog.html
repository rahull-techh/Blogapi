{% extends "base.html" %}

{% block title %}
Edit Post
{% endblock %}

{% block content %}

<div class="container">

    <h1>Edit Post</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ post.title }}"
            required
        >

        <br><br>

        <textarea
            name="content"
            rows="10"
            required
        >{{ post.content }}</textarea>

        <br><br>

        <button type="submit">
            Update Post
        </button>

    </form>

</div>

{% endblock %}
