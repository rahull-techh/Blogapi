{% extends "base.html" %}

{% block title %}
Login
{% endblock %}
{% block content %}

<div class="container">
    <h1>Login</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
        <button type="submit">
            Login
        </button>
    </form>
    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>

{% endblock %}
