{% extends "base.html" %}
{% block title %}
Register
{% endblock %}
{% block content %}

<div class="container">
    <h1>Register</h1>

    <form action="{% url 'register' %}" method="POST">
        {% csrf_token %}
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
        <button type="submit">
            Register
        </button>
    </form>
    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

{% endblock %}
